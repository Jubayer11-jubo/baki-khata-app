<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="book-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- White Card Outline / Shadow -->
  <g filter="url(#drop-shadow)">
    <!-- Traditional Ledger / Khata Book Base -->
    <rect x="110" y="96" width="292" height="320" rx="24" fill="#FFFFFF" />
    <!-- Red Khata Spine / Ribbon Accent -->
    <rect x="110" y="96" width="46" height="320" rx="24" fill="url(#book-grad)" />
    <!-- Binding stitching dots -->
    <circle cx="133" cy="140" r="4" fill="#FEF2F2" />
    <circle cx="133" cy="200" r="4" fill="#FEF2F2" />
    <circle cx="133" cy="260" r="4" fill="#FEF2F2" />
    <circle cx="133" cy="320" r="4" fill="#FEF2F2" />
    <circle cx="133" cy="380" r="4" fill="#FEF2F2" />

    <!-- Ledger Lines -->
    <rect x="180" y="140" width="180" height="14" rx="7" fill="#E2E8F0" />
    <rect x="180" y="180" width="130" height="12" rx="6" fill="#E2E8F0" />
    <rect x="180" y="220" width="150" height="12" rx="6" fill="#E2E8F0" />

    <!-- Bangladeshi Taka ৳ Symbol inside modern badge -->
    <circle cx="280" cy="310" r="64" fill="#2563EB" />
    <text x="280" y="334" font-family="'Noto Sans Bengali', 'Hind Siliguri', 'Segoe UI', Arial, sans-serif" font-size="76" font-weight="bold" fill="#FFFFFF" text-anchor="middle">৳</text>
    
    <!-- Checkmark badge (settled / verified digital ledger) -->
    <circle cx="336" cy="260" r="22" fill="#16A34A" />
    <path d="M327 260 L333 266 L345 254" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
